  pointer is wired, because no document exists to point at.

context: >-
  For a CDR data holder the absence of an anonymous /.well-known/openid-configuration
  is expected rather than a defect: the Consumer Data Standards publish each data
  holder's infosec base URI, and therefore its OpenID Provider Configuration, only
  through the AUTHENTICATED portion of the CDR Register. The anonymous public base
  URI serves the two Data Holder Operations discovery paths and nothing else. The
  absence of a security.txt, by contrast, is a genuine gap.

