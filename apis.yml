name: Red Energy
kind: company
description: >-
  Red Energy Pty Ltd (ABN 60 107 479 372) is an Australian electricity and gas retailer,
  wholly owned by Snowy Hydro Ltd, that supplies more than a million residential and business
  customers across New South Wales, Victoria, Queensland, South Australia and the ACT from a
  Richmond, Victoria base. It sits on the retail end of the National Electricity Market value
  chain: Snowy Hydro generates, the distribution network businesses own the poles and wires,
  AEMO operates the market and holds metering data, and Red Energy owns the customer, the
  tariff and the bill. Its API posture is entirely a product of statute rather than product
  strategy. Red Energy publishes no developer portal, no self-serve API programme and no
  proprietary specification - developer., api., docs. and data. subdomains do not resolve, and
  redenergy.com.au itself sits behind a Cloudflare bot challenge that returns HTTP 403 to any
  non-browser client. What it does have is a real, verified Consumer Data Right implementation:
  it is a designated CDR energy data holder listed on the CDR Register with the public base URI
  https://public.cdr.redenergy.com.au, which serves the Consumer Data Standards discovery
  endpoints live with correct x-v version negotiation, while 1,705 Red Energy branded plans are
  published anonymously through the Australian Energy Regulator's Energy Made Easy CDR host.
  The split is the story - open, standardised, anonymous product reference data on one side, and
  consumer usage, billing and account data available only to accredited CDR data recipients with
  the customer's consent on the other, with nothing at all in between.
