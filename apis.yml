- aid: red-energy:red-energy-cdr-energy-consumer-data-api
  name: Red Energy CDR Energy Consumer Data API
  description: >-
    The consumer-authorised half of the Consumer Data Right energy obligation that Red Energy is
    designated to meet as a data holder - electricity service points, usage, distributed energy
    resources, energy accounts, balances, invoices, billing, concessions and payment schedules,
    sixteen paths in all from the Consumer Data Standards CDR Energy API. This surface is real
    and mandated, but it is not open: it is reachable only by an accredited CDR data recipient,
    over mutual TLS with FAPI-profile OAuth2 and OpenID Connect, after the individual customer
    grants consent, and the infosec base URI is published only through the authenticated portion
    of the CDR Register. No baseURL is recorded here because none is publicly discoverable, and
    no endpoint on this surface was called - it cannot be reached anonymously. The mandate is
    verified; the endpoints are, by design, unverifiable from outside the accreditation regime.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#energy-apis
