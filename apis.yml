x-coverage:
  state: blocked
  reason: bot-challenge
  detail: 'Identity pass 2026-10-21: www.redenergy.com.au answers a browser User-Agent with an HTTP 403 Cloudflare challenge (pre-flight front_door
    verdict bot-challenge), so the company site itself cannot be read. Identity is established from hosts that do answer: the CDR Register brand
    summary lists Red Energy with redenergy.com.au assets, Red Energy''s own CDR host public.cdr.redenergy.com.au serves Get Status live (x-v
    1), and its LinkedIn page and Snowy Hydro''s retail page name it. Website pointer kept as https://www.redenergy.com.au/ (page exists, only
    our crawler is challenged).'
  evidence:
  - url: https://www.redenergy.com.au/
    status: 403
  - url: https://public.cdr.redenergy.com.au/cds-au/v1/discovery/status
    status: 200
  - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    status: 200
  - url: https://www.linkedin.com/company/red-energy
    status: 200
  - url: https://www.snowyhydro.com.au/retail/
    status: 200

