apis:
- aid: red-energy:red-energy-cdr-energy-product-reference-data-api
  name: Red Energy CDR Energy Product Reference Data API
  description: >-
    The unauthenticated Consumer Data Right Product Reference Data surface for the Red Energy
    brand - Get Generic Plans and Get Generic Plan Detail from the Consumer Data Standards CDR
    Energy API. Unlike CDR banking, where each authorised deposit-taking institution serves its
    own product endpoint, energy plan data is served centrally by the Australian Energy
    Regulator's Energy Made Easy CDR host under a per-brand path. Confirmed live on 2026-07-27:
    GET /cds-au/v1/energy/plans with header x-v 1 returned HTTP 200 with response header x-v 1
    and meta.totalRecords 1705 Red Energy plans across electricity and gas; the same call with no
    x-v header returned HTTP 400 and with x-v 9 returned HTTP 406, exactly the version-negotiation
    behaviour the Consumer Data Standards prescribe. Plan detail requires x-v 3 or higher - x-v 1
    returns a urn:au-cds:error:cds-all:Header/UnsupportedVersion error. No API key, no signup and
    no accreditation is needed to call it.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#energy-apis
  baseURL: https://cdr.energymadeeasy.gov.au/red-energy/cds-au/v1
