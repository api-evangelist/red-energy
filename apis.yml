- aid: red-energy:red-energy-cdr-discovery-api
  name: Red Energy CDR Discovery API
  description: >-
    Red Energy's own registered Consumer Data Right public base URI, serving the two
    unauthenticated Data Holder Operations endpoints of the Consumer Data Standards CDR Common
    API - Get Status and Get Outages. This is the only API surface hosted on a Red Energy
    controlled domain. Confirmed live on 2026-07-27: GET /cds-au/v1/discovery/status with header
    x-v 1 returned HTTP 200 and a CDS-shaped envelope reporting status OK and "All services
    operational", GET /cds-au/v1/discovery/outages returned HTTP 200 with an empty outages array,
    the same calls without an x-v header returned HTTP 400, and x-v 3 returned HTTP 406. The base
    URI serves nothing else anonymously - /cds-au/v1/energy/plans, the site root and
    /.well-known/openid-configuration all return an nginx HTTP 404.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#common-apis
  baseURL: https://public.cdr.redenergy.com.au/cds-au/v1
