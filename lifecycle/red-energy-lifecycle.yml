deprecation:
  policy_url: https://consumerdatastandardsaustralia.github.io/standards/#endpoint-version-schedule
  mechanism: >-
    Endpoint versions are retired on a published schedule rather than through
    Sunset/Deprecation response headers. Each endpoint carries its own version
    train; the Endpoint Version Schedule table names the version, the obligation
    date and the retirement date for every endpoint in the standard.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  future_dated_obligations: https://consumerdatastandardsaustralia.github.io/standards/#future-dated-obligations
  future_dated_note: >-
    The Future Dated Obligations section is the forward-looking change register
    for data holders — it lists every standard change with a compliance date not
    yet reached. It functions as the roadmap Red Energy has to build to.
  deprecated_operations: []
  deprecated_operations_note: >-
    No operation in the harvested cds_energy or cds_common v1.36.0 documents
    carries deprecated true.

sla:
  availability_target: 99.5% per month
  availability_scope: >-
    Applies to authenticated and unauthenticated endpoints alike. A period of
    unavailability is any period when any endpoint defined in the standard cannot
    reliably return a successful response to a well-formed request.
  planned_outages_excluded: true
  planned_outage_rules:
    - Commensurate in length and frequency with the holder's other primary digital channels.
    - Published to data recipients with at least one week of lead time for normal outages.
    - May occur without notification only to resolve a critical service or security issue.
  performance_target: 95% of calls per hour within the nominated threshold
  performance_tiers:
    - tier: Unauthenticated
      threshold_ms: 1500
      applies_to: All unauthenticated endpoints not otherwise specified.
    - tier: High Priority
      threshold_ms: 1000
      applies_to: >-
        All InfoSec endpoints; the unauthenticated Get Status and Get Outages;
        and customer-present Get Energy Accounts, Get Energy Account Detail, Get
        Balance For Energy Account, Get Invoices For Account, Get Customer, Get
        Customer Detail.
    - tier: Low Priority
      threshold_ms: 1500
      applies_to: Customer-present energy calls including Get Agreed Payment Schedule and Get Concessions.
    - tier: Unattended
      threshold_ms: 4000
      applies_to: Unattended calls to the account and billing endpoints.
    - tier: Large Payload
      threshold_ms: 6000
      applies_to: Get Bulk Billing and Get Billing For Specific Accounts.
    - tier: Secondary Request
      threshold_ms: 1000
      applies_to: >-
        Customer-present Get Service Points, Get Service Point Detail and Get DER
        For Service Point (1500ms for secondary data holders).
    - tier: Large Secondary Request
      threshold_ms: 1500
      applies_to: >-
        Unattended service point calls and all Get Bulk Usage / Get Usage For
        Service Point calls (4500ms for secondary data holders).
  relief: >-
    Data holders may obtain relief from the non-functional requirements during a
    distributed denial-of-service attack or a significant traffic surge from a
    misbehaving data recipient software product; both should result in HTTP 429.
  url: https://consumerdatastandardsaustralia.github.io/standards/#non-functional-requirements

