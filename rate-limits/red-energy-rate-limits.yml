description: Red Energy publishes no rate limits of its own. As a designated CDR energy data holder it
  is bound by the Consumer Data Standards Non-functional Requirements, which set the traffic thresholds
  above which a data holder may freely throttle or reject calls without breaching its availability and
  performance obligations, plus per-data-set velocity limits on the highest-cost energy endpoints. These
  are ecosystem-wide obligations, not a commercial plan.
