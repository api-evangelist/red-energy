velocityLimits:
- dataSet: NMI Standing Data
  operations:
  - getElectricityServicePointDetail
  period: 24 hours
  allowedCalls: 10
- dataSet: Energy Usage Data
  operations:
  - getElectricityServicePointUsage
  - listElectricityUsageBulk
  - listElectricityUsageForServicePoints
  period: 24 hours
  allowedCalls: 10
- dataSet: DER Data
