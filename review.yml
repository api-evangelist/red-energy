actions:
  openapiPaths:
    - openapi/red-energy-cds-energy-openapi.yml
    - openapi/red-energy-cds-common-openapi.yml
  openapiProvenance: >-
    DSB Consumer Data Standards shared specifications (CDR Energy API v1.36.0 and CDR Common API
    v1.36.0), harvested verbatim 2026-07-27. NOT Red-Energy-proprietary. Red Energy publishes no
    OpenAPI document. Both files carry an inline provenance header stating source URL, fetch date,
    HTTP status, and exactly which paths Red Energy actually serves anonymously versus which are
    accredited-only and were never called.
  apisYmlUpdated: true
  reason: >-
    Red Energy has a real, verified public API surface, but it exists entirely because Part IVD of
    the Competition and Consumer Act compelled it. Three APIs are recorded: the open, anonymous
    Product Reference Data surface served under the Red Energy brand by the AER; the discovery
    surface on Red Energy's own registered CDR host; and the mandated consumer-data surface, listed
    with no baseURL because none is publicly discoverable and none of its endpoints were called.
