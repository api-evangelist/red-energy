  developerPortal:
    exists: false
    url: ''
    note: >-
      No developer portal of any kind. No developer/developers/api/docs/data subdomain resolves,
      and the main site is bot-blocked. The nearest thing to developer documentation for Red
      Energy's APIs is the Data Standards Body's Consumer Data Standards site, which is not Red
      Energy's property and describes the standard rather than this implementation.
  ownership:
    parent: Snowy Hydro Ltd
    note: >-
      Red Energy Pty Ltd, ABN 60 107 479 372 / ACN 107 479 372, is wholly owned by Snowy Hydro
      Ltd, which also owns Lumo Energy. Snowy Hydro generates; Red Energy retails to over one
      million customers across NSW, VIC, QLD, SA and the ACT. Not active in Tasmania, Western
      Australia or the Northern Territory.

